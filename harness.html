<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Kudominoes render harness</title>
    <style>
      html, body { margin: 0; height: 100%; background: #111; color: #eee; font: 13px system-ui, sans-serif; overflow: hidden; }
      #wrap { position: absolute; inset: 0 0 44px 0; display: flex; align-items: center; justify-content: center; }
      #app { position: relative; width: 100%; height: 100%; overflow: hidden; }
      #app.phoneP { width: 390px; height: 780px; max-height: 100%; }
      #app.phoneL { width: 844px; height: 390px; max-width: 100%; }
      #bar { position: absolute; left: 0; right: 0; bottom: 0; height: 44px; display: flex; gap: 6px; align-items: center; padding: 0 8px; background: #222; overflow-x: auto; white-space: nowrap; }
      button, select { background: #3a3a3a; color: #eee; border: 1px solid #555; border-radius: 6px; padding: 5px 9px; font: inherit; cursor: pointer; }
      #log { position: absolute; top: 4px; left: 6px; pointer-events: none; color: #ffd; text-shadow: 0 1px 2px #000; font-size: 12px; z-index: 5; }
    </style>
  </head>
  <body>
    <div id="wrap"><div id="app"></div></div>
    <div id="log"></div>
    <div id="bar">
      <button id="bAuto">Replay hand</button>
      <button id="bPlay">Play vs CPU</button>
      <button id="bHuman">Human move</button>
      <button id="bPass">Pass</button>
      <button id="bTranque">Tranque</button>
      <button id="b28">28-chain</button>
      <button id="bMatch">Match end</button>
      <button id="bReset">Reset</button>
      <select id="sFrame"><option value="">fill</option><option value="phoneP">phone portrait</option><option value="phoneL">phone landscape</option></select>
      <select id="sQ"><option>low</option><option selected>medium</option><option>high</option></select>
      <select id="sSpeed"><option value="1">1x</option><option value="1.8">fast</option><option value="0.4">slow</option></select>
    </div>
    <script type="module" src="/src/render/harness.ts"></script>
  </body>
</html>
