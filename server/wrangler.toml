# Kudominoes online rooms: one Worker + one Durable Object per room (free plan compatible).
name = "kudominoes-rooms"
main = "src/index.ts"
compatibility_date = "2026-11-01"

[[durable_objects.bindings]]
name = "ROOMS"
class_name = "Room"

# Free plan: Durable Objects must use the SQLite storage backend.
[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room"]

[observability]
enabled = true
